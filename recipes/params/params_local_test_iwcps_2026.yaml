init:
  counter_raw_copy: 0

flows:
  raw2Sv:
    exclude_before:
    exclude_raw_file: []
    parallel: False
    encode_mode: power
    waveform_mode: CW
    depth_offset: 7
    sonar_model: EK80
    datagram_type:
    nmea_sentence: GGA
    filename_pattern: "*.raw"
    path_raw: "path/to/raw_data"
    path_main: "path/to/output"
    file_Sv_csv: Sv_files.csv
    new_file_num_limit: 1

  create_MVBS:
    time_offset_seconds: 91271873
    slice_mins: 20
    num_slices: 3
    range_bin: 0.25m
    ping_time_bin: 5s
    path_main: "path/to/output"
    file_Sv_csv: Sv_files.csv
    file_MVBS_csv: MVBS_files.csv

  process_CPS:
    exclude_before:
    exclude_raw_file: []
    parallel: False
    sonar_model: EK80
    filename_pattern: "*.raw"
    path_raw: "path/to/raw_data"
    path_main: "path/to/output_CPS"
    file_Sv_csv: CPS_files.csv
    new_file_num_limit: 1

    encode_mode: power
    waveform_mode: CW
    target_frequency: 70000
    seafloor_threshold: [-40, 2.4, 1.0]
    seafloor_offset: 0.5
    seafloor_r0: 10
    seafloor_r1: 1000
    seafloor_wtheta: 28
    seafloor_wphi: 52
    mask_mode: threshold
    fallback_sv_threshold: -70