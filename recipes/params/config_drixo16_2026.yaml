init:  # TODO: consider moving this section to deploy_ship.yaml
  counter_raw_copy: 0

flows:
  raw2Sv:
    exclude_before: # "2025-06-13T10:00:00+00:00"  # use ISO8601 format: if UTC use +00:00 or Z
    exclude_raw_file: []
      # - "IWCPS-D20250617-T175659.raw"
      # - "IWCPS-D20250711-T212420.raw"
      # - "IWCPS-D20250901-T145533.raw"
    parallel: False
    encode_mode: power
    waveform_mode: CW
    depth_offset: 7
    sonar_model: EK80
    nmea_sentence: GGA
    filename_pattern: "DY2601-*.raw" # .raw filename pattern to include
    path_raw: "/Users/feresa/drixo16_2026_data" # path to raw files
    path_main: "/Users/feresa/drixo16_2026_output"
    file_Sv_csv: Sv_files.csv
  create_MVBS:
    slice_mins: 20
    num_slices: 3
    range_bin: 0.25m
    ping_time_bin: 5s
    path_main: "/Users/feresa/drixo16_2026_output"
    file_Sv_csv: Sv_files.csv
    file_MVBS_csv: MVBS_files.csv
  file_upload_acoustics:
    src_dir: "/Users/feresa/drixo16_2026_output"
    dest_dir: "osn_sdsc_hake:/agr230002-bucket01/prefect_drixo16_2026/acoustics"
    exclude_subdirs:
      - Sv
    max_age: 2
