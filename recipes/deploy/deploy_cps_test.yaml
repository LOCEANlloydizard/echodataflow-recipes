flows:
  copy_raw:
    deployment_name: copy-raw-cps-test
    interval: 3
    inject_time_offset: true

  raw2Sv:
    deployment_name: raw2Sv-cps-test
    triggers:
      - expect: "echodataflow.raw.updated"
        resource_name: "raw-monitor"
        resource_scope: primary

  simulate_transects:
    deployment_name: simulate-transects-cps-test
    interval: 3

  process_CPS:
    deployment_name: process-CPS-cps-test
    triggers:
      - expect: "echodataflow.transect.updated"
        resource_name: "transect-monitor"
        resource_scope: related

  update_cache_CPS:
    deployment_name: update-cache-CPS-cps-test
    interval: 1