# Generic Echoshader app using the working HoloViz layout.
# Place this YAML beside echoshader_yaml_app.py in echodataflow-recipes.
app:
  title: Echoshader — Basic acoustic exploration
  source: survey
  route: basic
  port: 1807

data:
  survey:
    type: netcdf
    path: ../../../echoshader/examples/data/concatenated_MVBS.nc
    label: Acoustic survey

navigation:
  max_pings: 500

display:
  max_range_samples: 1200
