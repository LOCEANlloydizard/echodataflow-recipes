data:
  mvbs:
    type: zarr
    path: .local/basic/main/MVBS/MVBS_20230811T170000.zarr

elements:
  echograms:
    type: echogram
    data: mvbs
    args:
      vert_dim: depth
      channel:
        - "WBT 400141-15 ES18_ES"
        - "WBT 400143-15 ES38B_ES"
        - "WBT 400142-15 ES70-7C_ES"
        - "WBT 400140-15 ES120-7C_ES"
        - "WBT 400145-15 ES200-7C_ES"
    opts:
      clim: [-70, -36]
      cmap: viridis
      width: 1000
      height: 400
      tools:
        - hover

  tricolor:
    type: tricolor_echogram
    data: mvbs
    args:
      vert_dim: depth
      channel:
        - "WBT 400140-15 ES120-7C_ES"
        - "WBT 400143-15 ES38B_ES"
        - "WBT 400141-15 ES18_ES"
      vmin: -70
      vmax: -36
