flows:
  fetch_spasso:
    host: "download host"
    port: 2221
    remote_path: "remote path"

    path_main: "path/to/spasso"

    product_patterns:
      - "Copernicus_PHY"
      - "Copernicus_SST_L4"
      - "Copernicus_SSS_L4"
      - "Copernicus_CHL_L4"
      - "FTLE_Copernicus_PHY"
      - "OW_Copernicus_PHY"
      - "KE_Copernicus_PHY"
      - "LLADV_Copernicus_PHY"

    username_secret: "spasso-username"
    password_secret: "spasso-password"

    task_retries: 3
    task_retry_delay_seconds: 30

navigation:
  port: "serial port"
  baudrate: 4800
  path_output: "path/to/navigation"